name: MCP Server Extension CI

on: [push, pull_request, workflow_dispatch]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    env:
      EXTENSION_VERSION: ${{ needs.setup.outputs.version }}
      LUCEE_TEST_VERSIONS_7: ${{ vars.LUCEE_TEST_VERSIONS_7 }}
    strategy:
      matrix:
        lucee: ${{ fromJSON(vars.LUCEE_TEST_VERSIONS_7) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B -e -f pom.xml clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpserver-lex-${{ matrix.lucee.version }}
          path: |
            target/*.lex
            !target/*.lite.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee
          ref: ${{ matrix.lucee.branch }}

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
          extensions: EFDEB172-F52E-4D84-9CD1A1F561B3DFC8
        env:
          testLabels: mcpserver
          testAdditional: ${{ github.workspace }}/tests
          LUCEE_ADMIN_PASSWORD: admin

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    # deploy only from pushes (or manual runs) on the default branch, never for pull requests or other branches
    if: always() && needs.build-and-test.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml
        # in the deploy bundle; Central then rejects it
        # ("Bundle has content that does NOT have a .pom file"). Pin 3.9.16 for the deploy.
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot -------"
            mvn -B -e -f pom.xml clean deploy --settings maven-settings.xml
          elif [[ "$VERSION" == *-ALPHA ]]; then
            echo "------- Maven Install alpha -------"
            mvn -B -e -f pom.xml clean install --settings maven-settings.xml
          elif [[ "$VERSION" == *-RC ]] || [[ "$VERSION" == *-BETA ]]; then
            echo "------- Maven Deploy pre-release ($VERSION) -------"
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          else
            echo "------- Maven Deploy release -------"
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # LDEV-6693: the published .lex files (full and lite) for the github-release job
      - name: Upload artifact for GitHub release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcpserver-release
          path: target/*.lex

  # LDEV-6693: publish every final, BETA and RC build as a GitHub release with its .lex files attached,
  # so ext.lucee.org can redirect downloads to GitHub releases (LDEV-6511). -SNAPSHOT and ALPHA builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central deploy.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, deploy]
    # only from the default branch, like the deploy job
    # ALPHA builds are not published (the deploy job only runs mvn install), so they get no GitHub release either
    if: >-
      always() && needs.deploy.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
      && !endsWith(needs.setup.outputs.version, '-ALPHA')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the files the deploy job built and published
      - name: Download published extension
        uses: actions/download-artifact@v4
        with:
          name: mcpserver-release
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (1.0.1.6 or 1.0.1.6-RC), created on this commit
          # if it does not exist yet. BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi
